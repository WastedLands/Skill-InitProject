# TODO: pin GitHub-owned actions to full commit SHAs before publishing
# (repo convention: no floating tags, no third-party actions).
name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Hard gate: Agent Skills spec + repo conventions.
      - run: node scripts/validate-skill.mjs --strict
      # Advisory: the official spec validator flags `disable-model-invocation`
      # as an unexpected field. That field is Claude-Code-documented and
      # intentional (symmetric with Codex's allow_implicit_invocation: false),
      # so this step is informational only.
      - run: npx -y skills-ref validate skills/init-project
        continue-on-error: true
      - run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8')); JSON.parse(require('fs').readFileSync('plugin.json','utf8')); console.log('plugin manifests parse OK')"
