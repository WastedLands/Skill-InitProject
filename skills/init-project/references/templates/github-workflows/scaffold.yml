# Generated by init-project. Scaffold checks only — extend with the implementation gate.
# Repo convention: GitHub-owned actions pinned to full commit SHAs, no third-party actions.
# (SHAs below were current 2026-10-04; refresh them when updating the template.)
name: scaffold

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: No unfilled placeholders
        run: |
          if grep -rE '\{\{[A-Z][A-Z0-9_]*\}\}' --include='*.md' . | grep -v '{{PLACEHOLDER}}'; then
            echo "unfilled placeholders found"; exit 1
          fi
      # OPENSPEC-ONLY: delete this step in planning-lite mode.
      - name: OpenSpec validate
        run: OPENSPEC_TELEMETRY=0 npx -y @fission-ai/openspec@1.14.0 validate --all --strict
