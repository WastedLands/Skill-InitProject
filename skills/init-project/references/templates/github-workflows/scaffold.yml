# Generated by init-project. Scaffold checks only — extend with the implementation gate.
# Repo convention: GitHub-owned actions pinned to full commit SHAs, no third-party actions.
# (SHAs below were current 2026-10-04; refresh them when updating the template.)
name: scaffold

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: No unfilled placeholders
        run: |
          # grep exit 1 = no matches (clean). Any other non-zero exit is a
          # scan failure and must propagate — never silently pass.
          if grep -rEn --include='*.md' --exclude-dir=.git --exclude-dir=node_modules '[{][{]' .; then
            echo "Unfilled template placeholders found" >&2
            exit 1
          else
            code=$?
            if [ "$code" -ne 1 ]; then
              echo "Placeholder scan failed (grep exit $code)" >&2
              exit "$code"
            fi
          fi
      # OPENSPEC-ONLY: delete the following two steps in planning-lite mode.
      - name: OpenSpec validate
        run: OPENSPEC_TELEMETRY=0 npx -y @fission-ai/openspec@1.14.0 validate --all --strict
      - name: OpenSpec config health
        run: |
          # doctor exits 0 even when it silently ignores malformed config rules
          # (e.g. an unquoted ": " turning a rule into a mapping). It reports
          # those on stderr instead — any stderr output fails this step.
          err=$(OPENSPEC_TELEMETRY=0 npx -y @fission-ai/openspec@1.14.0 doctor --json 2>&1 1>/dev/null)
          if [ -n "$err" ]; then echo "$err" >&2; exit 1; fi
